# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: sherpa-camp2-gateway
metadata:
  template: sherpa-mcp-security-workshop@1.0.0

services:
  sherpa-mcp-server:
    project: ./servers/sherpa-mcp-server
    language: python
    host: containerapp
    docker:
      buildArgs:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
  
  trail-api:
    project: ./servers/trail-api
    language: python
    host: containerapp
    docker:
      buildArgs:
        - PIP_INDEX_URL=${PIP_INDEX_URL}

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preup:
    posix:
      shell: sh
      run: ./scripts/hooks/configure-package-index.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/hooks/configure-package-index.ps1
      continueOnError: false

  prepackage:
    posix:
      shell: sh
      run: ./scripts/hooks/configure-package-index.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/hooks/configure-package-index.ps1
      continueOnError: false

  predeploy:
    posix:
      shell: sh
      run: ./scripts/hooks/configure-package-index.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/hooks/configure-package-index.ps1
      continueOnError: false

  preprovision:
    posix:
      shell: sh
      run: ./scripts/hooks/preprovision.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/hooks/preprovision.ps1
      continueOnError: false
  
  postprovision:
    posix:
      shell: sh
      run: ./scripts/hooks/postprovision.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/hooks/postprovision.ps1
      continueOnError: false
