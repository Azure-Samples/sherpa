name: Validate workshop dependencies
run-name: "Dependencies for ${{ inputs.pr_number && format('PR #{0}', inputs.pr_number) || github.ref }}"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to validate against main (empty for this ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: base
            directory: camps/base-camp
          - project: identity
            directory: camps/camp1-identity
          - project: sherpa
            directory: camps/camp2-gateway/servers/sherpa-mcp-server
          - project: trail
            directory: camps/camp2-gateway/servers/trail-api
          - project: headers
            directory: camps/camp2-gateway/samples/mcp-custom-headers
          - project: foundry
            directory: camps/camp2-gateway/samples/foundry-tools
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install uv==0.7.20

      - name: Restore exact locked dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          uv sync --locked --no-dev --python 3.11
          uv pip check --python .venv/bin/python
          git diff --exit-code -- pyproject.toml uv.lock

      - name: Exercise workshop behavior without Azure credentials
        working-directory: ${{ matrix.directory }}
        env:
          SMOKE_PROJECT: ${{ matrix.project }}
        run: uv run --no-sync python "$GITHUB_WORKSPACE/tests/dependency_smoke.py" "$SMOKE_PROJECT"

  container:
    name: Locked Sherpa container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false

      - name: Build from the reviewed lockfile
        run: |
          docker build --tag sherpa-smoke \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            camps/camp2-gateway/servers/sherpa-mcp-server
          docker run --rm sherpa-smoke python -m pip check

      - name: Exercise the installed container dependencies
        run: |
          docker run --rm --env PYTHONPATH=/app \
            --volume "$GITHUB_WORKSPACE/tests:/checks:ro" \
            sherpa-smoke python /checks/dependency_smoke.py sherpa
